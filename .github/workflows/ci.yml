name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least-privilege: this workflow only needs to read the repository.
# It never requires repository secrets.
permissions:
  contents: read

# Cancel superseded runs for the same branch/PR to avoid wasting runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, unit test and assemble (debug)
    runs-on: ubuntu-latest
    # Local baseline for all three commands combined is roughly 50 minutes.
    # Allow generous headroom so a cold-cache CI run is not killed mid-build.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 25 is required by the project's toolchain:
      # gradle/gradle-daemon-jvm.properties pins toolchainVersion=25, and the
      # locally verified baseline was produced with OpenJDK 25.0.3.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          # Caches ~/.gradle (dependency cache + wrapper distribution)
          # keyed on the Gradle wrapper / build script hashes.
          cache: gradle

      # Provides cmdline-tools + sets ANDROID_SDK_ROOT and accepts SDK licenses.
      #
      # The `packages` input MUST be set explicitly. Its default is
      # "tools platform-tools", and the legacy "tools" package no longer exists
      # in Google's SDK repository, so the default fails with
      #   Warning: Failed to find package 'tools'
      #   Error: .../sdkmanager failed with exit code 1
      # which aborts the job before any Gradle command runs.
      # "platform-tools" is the only part of that default that is still valid.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # compileSdk is declared as the minor API level 36.1
      # (see app/build.gradle.kts: compileSdk { version = release(36) { minorApiLevel = 1 } }),
      # so the exact "platforms;android-36.1" package is required.
      # build-tools 36.0.0 matches the version used by the verified local baseline.
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      # gradlew is committed with mode 100644 (not executable) in this repository,
      # so the Linux checkout cannot execute it until the bit is set.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # NOTE: no API keys or secrets are set here.
      # The Secrets Gradle Plugin is configured with
      #   propertiesFileName = ".env"              (absent in CI)
      #   defaultPropertiesFileName = ".env.example" (committed, placeholder values)
      # so BuildConfig receives committed placeholders such as
      # GOOGLE_BOOKS_KEY=MY_GOOGLE_BOOKS_KEY. No real credential is required or stored.

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin

      # Robolectric downloads its android-all runtime jar from Maven Central
      # during this task; network access is expected and allowed.
      - name: Run debug unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
